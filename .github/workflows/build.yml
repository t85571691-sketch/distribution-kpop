name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare project
        run: |
          echo "=== FILES IN REPO ==="
          find . -path ./.git -prune -o -type f -print | sort
          mkdir -p app/src/main/java/com/linedist/app app/src/main/assets
          cat > settings.gradle.kts <<'EOT'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "LineDistribution"
          include(":app")
          EOT
          cat > build.gradle.kts <<'EOT'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOT
          printf 'org.gradle.jvmargs=-Xmx3g\nandroid.useAndroidX=true\n' > gradle.properties
          cat > app/build.gradle.kts <<'EOT'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.linedist.app"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.linedist.app"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.webkit:webkit:1.11.0")
          }
          EOT
          [ -f AndroidManifest.xml ] && mv -f AndroidManifest.xml app/src/main/AndroidManifest.xml || true
          for k in MainActivity RecService ScreenRecorder VideoExporter; do
            [ -f $k.kt ] && mv -f $k.kt app/src/main/java/com/linedist/app/$k.kt || true
          done
          [ -f index.html ] && mv -f index.html app/src/main/assets/index.html || true
          missing=0
          for f in app/src/main/AndroidManifest.xml app/src/main/assets/index.html \
                   app/src/main/java/com/linedist/app/MainActivity.kt \
                   app/src/main/java/com/linedist/app/RecService.kt \
                   app/src/main/java/com/linedist/app/ScreenRecorder.kt \
                   app/src/main/java/com/linedist/app/VideoExporter.kt; do
            if [ ! -f "$f" ]; then echo "::error::MISSING FILE: $f"; missing=1; fi
          done
          exit $missing
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: LineDistribution-APK
          path: app/build/outputs/apk/debug/app-debug.apk
